name: Font artifact v2

run-name: >-
  FontArtifactV2 ${{ inputs.filename }}
  [${{ inputs.output_key }}]

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public HTTPS direct URL of the font file
        required: true
        type: string

      filename:
        description: Safe output font filename
        required: true
        type: string

      output_key:
        description: Unique output directory key generated by the Worker
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: >-
    font-artifact-v2-${{ inputs.output_key }}
  cancel-in-progress: false

jobs:
  fetch-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_URL: >-
        ${{ inputs.source_url }}
      REQUESTED_FILENAME: >-
        ${{ inputs.filename }}
      OUTPUT_KEY: >-
        ${{ inputs.output_key }}
      MAX_BYTES: "73400320"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download and encode font
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import base64
          import hashlib
          import ipaddress
          import json
          import os
          import re
          import socket
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path


          source_url = os.environ["SOURCE_URL"].strip()
          filename = os.environ["REQUESTED_FILENAME"].strip()
          output_key = os.environ["OUTPUT_KEY"].strip()
          max_bytes = int(os.environ["MAX_BYTES"])


          if not re.fullmatch(r"[a-f0-9]{32}", output_key):
              raise RuntimeError("Invalid output_key")

          if not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9._-]{0,119}",
              filename,
          ):
              raise RuntimeError("Invalid filename")

          if Path(filename).suffix.lower() not in {".ttf", ".otf"}:
              raise RuntimeError("Only .ttf and .otf files are allowed")

          if len(source_url) > 4096:
              raise RuntimeError("source_url is too long")


          def validate_public_https_url(value: str) -> str:
              parsed = urllib.parse.urlsplit(value)

              if parsed.scheme.lower() != "https":
                  raise RuntimeError("Only HTTPS source URLs are allowed")

              if not parsed.hostname:
                  raise RuntimeError("Source URL has no hostname")

              if parsed.username or parsed.password:
                  raise RuntimeError(
                      "Source URL must not contain embedded credentials"
                  )

              try:
                  port = parsed.port or 443
              except ValueError as exc:
                  raise RuntimeError("Source URL has an invalid port") from exc

              hostname = parsed.hostname.rstrip(".")
              lowered = hostname.lower()

              if lowered == "localhost" or lowered.endswith(".localhost"):
                  raise RuntimeError("localhost is not allowed")

              if lowered.endswith(".local") or lowered.endswith(".internal"):
                  raise RuntimeError("Local/internal hostnames are not allowed")

              try:
                  addresses = socket.getaddrinfo(
                      hostname,
                      port,
                      type=socket.SOCK_STREAM,
                  )
              except socket.gaierror as exc:
                  raise RuntimeError(
                      f"DNS resolution failed for {hostname}: {exc}"
                  ) from exc

              resolved = {
                  item[4][0].split("%", 1)[0]
                  for item in addresses
              }

              if not resolved:
                  raise RuntimeError("Hostname resolved to no addresses")

              for ip_text in resolved:
                  ip = ipaddress.ip_address(ip_text)
                  if not ip.is_global:
                      raise RuntimeError(
                          f"Non-public destination is not allowed: {ip_text}"
                      )

              return urllib.parse.urlunsplit(parsed)


          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(
                  self,
                  req,
                  fp,
                  code,
                  msg,
                  headers,
                  newurl,
              ):
                  absolute = urllib.parse.urljoin(req.full_url, newurl)
                  validate_public_https_url(absolute)
                  return super().redirect_request(
                      req,
                      fp,
                      code,
                      msg,
                      headers,
                      absolute,
                  )


          def detect_font_format(prefix: bytes, total_size: int) -> str:
              if prefix.startswith(b"OTTO"):
                  return "OpenType/CFF"

              if prefix.startswith(b"\x00\x01\x00\x00"):
                  return "TrueType/OpenType"

              if prefix.startswith(b"true"):
                  return "TrueType"

              if prefix.startswith(b"typ1"):
                  return "OpenType/Type1"

              if prefix.startswith(b"ttcf"):
                  return "TrueType/OpenType Collection"

              if prefix.startswith(b"wOFF"):
                  return "WOFF"

              if prefix.startswith(b"wOF2"):
                  return "WOFF2"

              if prefix.startswith(b"%!PS-AdobeFont"):
                  return "PostScript Type 1 ASCII"

              if prefix.startswith(b"%!FontType1"):
                  return "PostScript Type 1 ASCII"

              if prefix.startswith(b"\x80\x01"):
                  return "PostScript Type 1 Binary"

              if (
                  total_size >= 36
                  and len(prefix) >= 36
                  and prefix[34:36] == b"LP"
              ):
                  return "Embedded OpenType"

              if len(prefix) >= 4:
                  major = prefix[0]
                  minor = prefix[1]
                  header_size = prefix[2]

                  if major == 1 and minor == 0 and 4 <= header_size <= 64:
                      return "CFF"

                  if major == 2 and minor == 0 and header_size == 5:
                      return "CFF2"

              raise RuntimeError(
                  "Downloaded content does not have a recognized font "
                  f"signature: {prefix[:16]!r}"
              )


          validated_url = validate_public_https_url(source_url)

          request = urllib.request.Request(
              validated_url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 Chrome/124 Safari/537.36"
                  ),
                  "Accept": "*/*",
                  "Accept-Encoding": "identity",
              },
              method="GET",
          )

          opener = urllib.request.build_opener(SafeRedirectHandler())
          temp_path = Path("/tmp/font-artifact-v2.bin")
          sha256 = hashlib.sha256()
          total = 0
          prefix = bytearray()

          try:
              response = opener.open(request, timeout=45)
          except urllib.error.HTTPError as exc:
              raise RuntimeError(
                  f"Font download returned HTTP {exc.code}: {exc.reason}"
              ) from exc
          except urllib.error.URLError as exc:
              raise RuntimeError(f"Font download failed: {exc.reason}") from exc

          with response:
              status = getattr(response, "status", response.getcode())
              if status < 200 or status >= 300:
                  raise RuntimeError(f"Font download returned HTTP {status}")

              final_url = validate_public_https_url(response.geturl())
              content_type = response.headers.get("Content-Type", "")
              content_length = response.headers.get("Content-Length")

              if content_length:
                  try:
                      declared_size = int(content_length)
                  except ValueError:
                      declared_size = None

                  if declared_size is not None and declared_size > max_bytes:
                      raise RuntimeError(
                          "Font is too large: "
                          f"declared={declared_size} limit={max_bytes}"
                      )

              with temp_path.open("wb") as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break

                      total += len(chunk)
                      if total > max_bytes:
                          raise RuntimeError(
                              f"Font exceeded the {max_bytes}-byte limit"
                          )

                      if len(prefix) < 128:
                          needed = 128 - len(prefix)
                          prefix.extend(chunk[:needed])

                      sha256.update(chunk)
                      output.write(chunk)

          if total < 4:
              raise RuntimeError("Downloaded file is too small to be a font")

          detected_format = detect_font_format(bytes(prefix), total)

          if detected_format in {
              "WOFF",
              "WOFF2",
              "TrueType/OpenType Collection",
              "Embedded OpenType",
              "PostScript Type 1 ASCII",
              "PostScript Type 1 Binary",
              "CFF",
              "CFF2",
          }:
              raise RuntimeError(
                  "The artifact service only accepts standalone .ttf/.otf "
                  f"files; detected={detected_format}"
              )

          actual_sha256 = sha256.hexdigest()

          output_dir = Path("font-artifacts-v2") / output_key
          output_dir.mkdir(parents=True, exist_ok=False)

          base64_path = output_dir / f"{filename}.b64.txt"
          metadata_path = output_dir / "metadata.json"

          with temp_path.open("rb") as source, base64_path.open("wb") as target:
              base64.encode(source, target)

          metadata = {
              "version": 2,
              "source_url": source_url,
              "final_url": final_url,
              "filename": filename,
              "output_key": output_key,
              "size_bytes": total,
              "sha256": actual_sha256,
              "detected_format": detected_format,
              "content_type": content_type,
              "base64_file": base64_path.as_posix(),
              "base64_size_bytes": base64_path.stat().st_size,
          }

          metadata_path.write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

      - name: Commit font artifact output
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "font-artifacts-v2/${OUTPUT_KEY}"
          git commit \
            -m \
            "Store font artifact v2 ${REQUESTED_FILENAME} [${OUTPUT_KEY}]"

          for attempt in 1 2 3 4 5
          do
            if git push origin "HEAD:${GITHUB_REF_NAME}"
            then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing and retrying..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done

          echo "Unable to push output after 5 attempts" >&2
          exit 1
