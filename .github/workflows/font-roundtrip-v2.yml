name: Font corpus roundtrip v2

run-name: >-
  FontRoundtripV2 ${{ inputs.font_filename }}
  [${{ inputs.output_key }}]

on:
  workflow_dispatch:
    inputs:
      corpus_url:
        description: Public HTTPS URL of the UTF-8 character test corpus
        required: true
        type: string

      font_url:
        description: Public HTTPS direct URL of the candidate font
        required: true
        type: string

      font_filename:
        description: Safe candidate font filename
        required: true
        type: string

      output_key:
        description: Unique output directory key generated by the Worker
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: >-
    font-roundtrip-v2-${{ inputs.output_key }}
  cancel-in-progress: false

jobs:
  validate-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CORPUS_URL: >-
        ${{ inputs.corpus_url }}
      FONT_URL: >-
        ${{ inputs.font_url }}
      FONT_FILENAME: >-
        ${{ inputs.font_filename }}
      OUTPUT_KEY: >-
        ${{ inputs.output_key }}

      MAX_FONT_BYTES: "73400320"
      MAX_CORPUS_BYTES: "4194304"
      MAX_CORPUS_CHARS: "20000"
      REQUIRED_PYMUPDF_VERSION: "1.26.7"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            "PyMuPDF==${REQUIRED_PYMUPDF_VERSION}" \
            "fonttools"

      - name: Run exact corpus roundtrip
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import hashlib
          import ipaddress
          import itertools
          import json
          import os
          import platform
          import re
          import socket
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          import pymupdf as fitz


          corpus_url = os.environ["CORPUS_URL"].strip()
          font_url = os.environ["FONT_URL"].strip()
          font_filename = os.environ["FONT_FILENAME"].strip()
          output_key = os.environ["OUTPUT_KEY"].strip()

          max_font_bytes = int(os.environ["MAX_FONT_BYTES"])
          max_corpus_bytes = int(os.environ["MAX_CORPUS_BYTES"])
          max_corpus_chars = int(os.environ["MAX_CORPUS_CHARS"])
          required_pymupdf_version = os.environ[
              "REQUIRED_PYMUPDF_VERSION"
          ]

          if fitz.__version__ != required_pymupdf_version:
              raise RuntimeError(
                  "Unexpected PyMuPDF version: "
                  f"{fitz.__version__}; required={required_pymupdf_version}"
              )

          if not re.fullmatch(r"[a-f0-9]{32}", output_key):
              raise RuntimeError("Invalid output_key")

          if not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9._-]{0,119}",
              font_filename,
          ):
              raise RuntimeError("Invalid font_filename")

          if Path(font_filename).suffix.lower() not in {".ttf", ".otf"}:
              raise RuntimeError("Only .ttf and .otf files are allowed")

          if len(corpus_url) > 4096:
              raise RuntimeError("corpus_url is too long")

          if len(font_url) > 4096:
              raise RuntimeError("font_url is too long")


          def validate_public_https_url(value: str) -> str:
              parsed = urllib.parse.urlsplit(value)

              if parsed.scheme.lower() != "https":
                  raise RuntimeError("Only HTTPS URLs are allowed")

              if not parsed.hostname:
                  raise RuntimeError("URL has no hostname")

              if parsed.username or parsed.password:
                  raise RuntimeError(
                      "URL must not contain embedded credentials"
                  )

              try:
                  port = parsed.port or 443
              except ValueError as exc:
                  raise RuntimeError("URL has an invalid port") from exc

              hostname = parsed.hostname.rstrip(".")
              lowered = hostname.lower()

              if lowered == "localhost" or lowered.endswith(".localhost"):
                  raise RuntimeError("localhost is not allowed")

              if lowered.endswith(".local") or lowered.endswith(".internal"):
                  raise RuntimeError("Local/internal hostnames are not allowed")

              try:
                  addresses = socket.getaddrinfo(
                      hostname,
                      port,
                      type=socket.SOCK_STREAM,
                  )
              except socket.gaierror as exc:
                  raise RuntimeError(
                      f"DNS resolution failed for {hostname}: {exc}"
                  ) from exc

              resolved = {
                  item[4][0].split("%", 1)[0]
                  for item in addresses
              }

              if not resolved:
                  raise RuntimeError("Hostname resolved to no addresses")

              for ip_text in resolved:
                  ip = ipaddress.ip_address(ip_text)
                  if not ip.is_global:
                      raise RuntimeError(
                          f"Non-public destination is not allowed: {ip_text}"
                      )

              return urllib.parse.urlunsplit(parsed)


          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(
                  self,
                  req,
                  fp,
                  code,
                  msg,
                  headers,
                  newurl,
              ):
                  absolute = urllib.parse.urljoin(req.full_url, newurl)
                  validate_public_https_url(absolute)
                  return super().redirect_request(
                      req,
                      fp,
                      code,
                      msg,
                      headers,
                      absolute,
                  )


          def download_to_file(
              url: str,
              output_path: Path,
              max_bytes: int,
              label: str,
          ):
              validated_url = validate_public_https_url(url)
              request = urllib.request.Request(
                  validated_url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 (X11; Linux x86_64) "
                          "AppleWebKit/537.36 Chrome/124 Safari/537.36"
                      ),
                      "Accept": "*/*",
                      "Accept-Encoding": "identity",
                  },
                  method="GET",
              )

              opener = urllib.request.build_opener(SafeRedirectHandler())

              try:
                  response = opener.open(request, timeout=45)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(
                      f"{label} download returned HTTP "
                      f"{exc.code}: {exc.reason}"
                  ) from exc
              except urllib.error.URLError as exc:
                  raise RuntimeError(
                      f"{label} download failed: {exc.reason}"
                  ) from exc

              total = 0
              sha256 = hashlib.sha256()
              prefix = bytearray()

              with response:
                  status = getattr(response, "status", response.getcode())
                  if status < 200 or status >= 300:
                      raise RuntimeError(
                          f"{label} download returned HTTP {status}"
                      )

                  final_url = validate_public_https_url(response.geturl())
                  content_type = response.headers.get("Content-Type", "")
                  content_length = response.headers.get("Content-Length")

                  if content_length:
                      try:
                          declared_size = int(content_length)
                      except ValueError:
                          declared_size = None

                      if (
                          declared_size is not None
                          and declared_size > max_bytes
                      ):
                          raise RuntimeError(
                              f"{label} is too large: "
                              f"declared={declared_size} limit={max_bytes}"
                          )

                  with output_path.open("wb") as output:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break

                          total += len(chunk)
                          if total > max_bytes:
                              raise RuntimeError(
                                  f"{label} exceeded the {max_bytes}-byte limit"
                              )

                          if len(prefix) < 128:
                              needed = 128 - len(prefix)
                              prefix.extend(chunk[:needed])

                          sha256.update(chunk)
                          output.write(chunk)

              return {
                  "final_url": final_url,
                  "content_type": content_type,
                  "size_bytes": total,
                  "sha256": sha256.hexdigest(),
                  "prefix": bytes(prefix),
              }


          def detect_font_format(prefix: bytes, total_size: int) -> str:
              if prefix.startswith(b"OTTO"):
                  return "OpenType/CFF"

              if prefix.startswith(b"\x00\x01\x00\x00"):
                  return "TrueType/OpenType"

              if prefix.startswith(b"true"):
                  return "TrueType"

              if prefix.startswith(b"typ1"):
                  return "OpenType/Type1"

              if prefix.startswith(b"ttcf"):
                  return "TrueType/OpenType Collection"

              if prefix.startswith(b"wOFF"):
                  return "WOFF"

              if prefix.startswith(b"wOF2"):
                  return "WOFF2"

              if prefix.startswith(b"%!PS-AdobeFont"):
                  return "PostScript Type 1 ASCII"

              if prefix.startswith(b"%!FontType1"):
                  return "PostScript Type 1 ASCII"

              if prefix.startswith(b"\x80\x01"):
                  return "PostScript Type 1 Binary"

              if (
                  total_size >= 36
                  and len(prefix) >= 36
                  and prefix[34:36] == b"LP"
              ):
                  return "Embedded OpenType"

              if len(prefix) >= 4:
                  major = prefix[0]
                  minor = prefix[1]
                  header_size = prefix[2]

                  if major == 1 and minor == 0 and 4 <= header_size <= 64:
                      return "CFF"

                  if major == 2 and minor == 0 and header_size == 5:
                      return "CFF2"

              raise RuntimeError(
                  "Downloaded content does not have a recognized font "
                  f"signature: {prefix[:16]!r}"
              )


          def ordered_unique_chars(text: str) -> str:
              seen = set()
              output = []

              for ch in text:
                  if ch in seen:
                      continue
                  seen.add(ch)
                  output.append(ch)

              return "".join(output)


          def codepoint_info(ch):
              if ch is None:
                  return None

              return {
                  "char": ch,
                  "codepoint": f"U+{ord(ch):04X}",
                  "name": unicodedata.name(ch, "<unnamed>"),
                  "category": unicodedata.category(ch),
              }


          def compare_strings(
              expected: str,
              actual: str,
              page_index: int,
              max_differences: int,
          ):
              differences = []

              for char_index, pair in enumerate(
                  itertools.zip_longest(
                      expected,
                      actual,
                      fillvalue=None,
                  )
              ):
                  expected_char, actual_char = pair

                  if expected_char == actual_char:
                      continue

                  differences.append(
                      {
                          "page_index": page_index,
                          "char_index": char_index,
                          "expected": codepoint_info(expected_char),
                          "actual": codepoint_info(actual_char),
                      }
                  )

                  if len(differences) >= max_differences:
                      break

              return differences


          def extract_exact_chars(page) -> str:
              raw = page.get_text("rawdict")
              chars = []

              for block in raw.get("blocks", []):
                  if block.get("type", 0) != 0:
                      continue

                  for line in block.get("lines", []):
                      for span in line.get("spans", []):
                          for item in span.get("chars", []):
                              chars.append(item.get("c", ""))

              return "".join(chars)


          def build_chunks(text: str, size: int = 160):
              return [
                  text[index:index + size]
                  for index in range(0, len(text), size)
              ]


          def wrap_boundary_whitespace(chunk: str, sentinel: str) -> str:
              if not chunk:
                  return chunk

              if chunk[0].isspace() or chunk[-1].isspace():
                  return sentinel + chunk + sentinel

              return chunk


          def run_roundtrip(
              font_path: Path,
              chunks,
              method: str,
          ):
              output_pdf = Path("/tmp") / f"roundtrip-v2-{method}.pdf"
              doc = fitz.open()
              prepared = []

              try:
                  for index, text in enumerate(chunks):
                      page = doc.new_page(width=5200, height=240)
                      font_name = f"F{index}"

                      page.insert_font(
                          fontname=font_name,
                          fontfile=str(font_path),
                          set_simple=False,
                      )

                      if method == "insert_text":
                          page.insert_text(
                              (30, 120),
                              text,
                              fontname=font_name,
                              fontsize=18,
                          )

                      elif method == "insert_textbox":
                          rc = page.insert_textbox(
                              fitz.Rect(30, 30, 5170, 210),
                              text,
                              fontname=font_name,
                              fontsize=18,
                              align=0,
                          )

                          if rc < 0:
                              raise RuntimeError(
                                  "insert_textbox did not fit: "
                                  f"page_index={index} rc={rc}"
                              )

                      else:
                          raise RuntimeError(f"Unknown method: {method}")

                      prepared.append(text)

                  doc.subset_fonts(fallback=True)
                  doc.save(
                      str(output_pdf),
                      garbage=4,
                      deflate=True,
                  )
              finally:
                  doc.close()

              reopened = fitz.open(str(output_pdf))
              differences = []

              try:
                  if reopened.page_count != len(prepared):
                      raise RuntimeError(
                          "Unexpected roundtrip page count: "
                          f"actual={reopened.page_count} "
                          f"expected={len(prepared)}"
                      )

                  for index, expected in enumerate(prepared):
                      actual = extract_exact_chars(reopened[index])

                      if actual != expected and len(differences) < 40:
                          remaining = 40 - len(differences)
                          differences.extend(
                              compare_strings(
                                  expected,
                                  actual,
                                  index,
                                  remaining,
                              )
                          )
              finally:
                  reopened.close()
                  output_pdf.unlink(missing_ok=True)

              return {
                  "status": "pass" if not differences else "fail",
                  "exact_roundtrip": not differences,
                  "subset_fonts_tested": True,
                  "difference_count": len(differences),
                  "differences": differences,
              }


          font_path = Path("/tmp/font-roundtrip-v2.bin")
          corpus_path = Path("/tmp/font-corpus-v2.txt")

          font_download = download_to_file(
              font_url,
              font_path,
              max_font_bytes,
              "font",
          )

          corpus_download = download_to_file(
              corpus_url,
              corpus_path,
              max_corpus_bytes,
              "corpus",
          )

          if font_download["size_bytes"] < 4:
              raise RuntimeError("Downloaded font is too small")

          detected_format = detect_font_format(
              font_download["prefix"],
              font_download["size_bytes"],
          )

          if detected_format not in {
              "OpenType/CFF",
              "TrueType/OpenType",
              "TrueType",
              "OpenType/Type1",
          }:
              raise RuntimeError(
                  "The roundtrip service only accepts standalone .ttf/.otf "
                  f"files; detected={detected_format}"
              )

          corpus_bytes = corpus_path.read_bytes()

          try:
              corpus_text = corpus_bytes.decode("utf-8-sig")
          except UnicodeDecodeError as exc:
              raise RuntimeError("Corpus must be valid UTF-8") from exc

          # Git-hosted text files commonly end with one line terminator.
          # The corpus itself is a character set, so one terminal line ending
          # is treated as file formatting rather than a test character.
          if corpus_text.endswith("\r\n"):
              corpus_text = corpus_text[:-2]
          elif corpus_text.endswith("\n"):
              corpus_text = corpus_text[:-1]

          corpus_text = ordered_unique_chars(corpus_text)

          if not corpus_text:
              raise RuntimeError("Corpus is empty")

          if len(corpus_text) > max_corpus_chars:
              raise RuntimeError(
                  "Corpus has too many unique characters: "
                  f"{len(corpus_text)} > {max_corpus_chars}"
              )

          invalid_controls = [
              ch
              for ch in corpus_text
              if unicodedata.category(ch) == "Cc"
          ]

          if invalid_controls:
              sample = [
                  codepoint_info(ch)
                  for ch in invalid_controls[:20]
              ]
              raise RuntimeError(
                  "Corpus contains control characters that are not suitable "
                  "for visible PDF text testing: "
                  + json.dumps(sample, ensure_ascii=False)
              )

          try:
              fitz_font = fitz.Font(fontfile=str(font_path))
          except Exception as exc:
              result = {
                  "version": 2,
                  "result": "fail",
                  "failure_stage": "pymupdf_load",
                  "failure_codes": ["pymupdf_font_load_failed"],
                  "error": f"{type(exc).__name__}: {exc}",
                  "font_url": font_url,
                  "font_final_url": font_download["final_url"],
                  "font_filename": font_filename,
                  "font_sha256": font_download["sha256"],
                  "font_size_bytes": font_download["size_bytes"],
                  "detected_format": detected_format,
                  "corpus_url": corpus_url,
                  "corpus_final_url": corpus_download["final_url"],
                  "corpus_sha256": corpus_download["sha256"],
                  "corpus_unique_character_count": len(corpus_text),
                  "environment": {
                      "python_version": platform.python_version(),
                      "pymupdf_version": fitz.__version__,
                  },
              }
          else:
              missing_chars = [
                  ch
                  for ch in corpus_text
                  if not fitz_font.has_glyph(ord(ch), fallback=False)
              ]

              if missing_chars:
                  result = {
                      "version": 2,
                      "result": "fail",
                      "failure_stage": "coverage",
                      "failure_codes": ["required_characters_missing"],
                      "missing_count": len(missing_chars),
                      "missing": [
                          codepoint_info(ch)
                          for ch in missing_chars[:100]
                      ],
                      "font_url": font_url,
                      "font_final_url": font_download["final_url"],
                      "font_filename": font_filename,
                      "font_sha256": font_download["sha256"],
                      "font_size_bytes": font_download["size_bytes"],
                      "detected_format": detected_format,
                      "corpus_url": corpus_url,
                      "corpus_final_url": corpus_download["final_url"],
                      "corpus_sha256": corpus_download["sha256"],
                      "corpus_unique_character_count": len(corpus_text),
                      "environment": {
                          "python_version": platform.python_version(),
                          "pymupdf_version": fitz.__version__,
                      },
                  }
              else:
                  sentinel = next(
                      (
                          ch
                          for ch in corpus_text
                          if not ch.isspace()
                      ),
                      None,
                  )

                  if sentinel is None:
                      raise RuntimeError(
                          "Corpus must contain at least one visible "
                          "non-whitespace character"
                      )

                  chunks = [
                      wrap_boundary_whitespace(chunk, sentinel)
                      for chunk in build_chunks(corpus_text)
                  ]

                  failure_codes = []

                  try:
                      insert_text = run_roundtrip(
                          font_path,
                          chunks,
                          "insert_text",
                      )
                  except Exception as exc:
                      insert_text = {
                          "status": "fail",
                          "exact_roundtrip": False,
                          "subset_fonts_tested": False,
                          "difference_count": 0,
                          "differences": [],
                          "error": f"{type(exc).__name__}: {exc}",
                      }

                  try:
                      insert_textbox = run_roundtrip(
                          font_path,
                          chunks,
                          "insert_textbox",
                      )
                  except Exception as exc:
                      insert_textbox = {
                          "status": "fail",
                          "exact_roundtrip": False,
                          "subset_fonts_tested": False,
                          "difference_count": 0,
                          "differences": [],
                          "error": f"{type(exc).__name__}: {exc}",
                      }

                  if not insert_text.get("exact_roundtrip", False):
                      failure_codes.append(
                          "insert_text_exact_roundtrip_failed"
                      )

                  if not insert_textbox.get("exact_roundtrip", False):
                      failure_codes.append(
                          "insert_textbox_exact_roundtrip_failed"
                      )

                  if not insert_text.get("subset_fonts_tested", False):
                      failure_codes.append(
                          "insert_text_subset_not_completed"
                      )

                  if not insert_textbox.get("subset_fonts_tested", False):
                      failure_codes.append(
                          "insert_textbox_subset_not_completed"
                      )

                  result = {
                      "version": 2,
                      "result": "fail" if failure_codes else "pass",
                      "failure_stage": (
                          "roundtrip" if failure_codes else None
                      ),
                      "failure_codes": failure_codes,
                      "font_url": font_url,
                      "font_final_url": font_download["final_url"],
                      "font_filename": font_filename,
                      "font_sha256": font_download["sha256"],
                      "font_size_bytes": font_download["size_bytes"],
                      "detected_format": detected_format,
                      "corpus_url": corpus_url,
                      "corpus_final_url": corpus_download["final_url"],
                      "corpus_sha256": corpus_download["sha256"],
                      "corpus_unique_character_count": len(corpus_text),
                      "chunk_count": len(chunks),
                      "roundtrip": {
                          "insert_text": insert_text,
                          "insert_textbox": insert_textbox,
                          "subset_fonts_tested": (
                              insert_text.get(
                                  "subset_fonts_tested",
                                  False,
                              )
                              and insert_textbox.get(
                                  "subset_fonts_tested",
                                  False,
                              )
                          ),
                      },
                      "environment": {
                          "python_version": platform.python_version(),
                          "pymupdf_version": fitz.__version__,
                      },
                  }

          output_dir = Path("font-roundtrip-v2") / output_key
          output_dir.mkdir(parents=True, exist_ok=False)
          validation_path = output_dir / "validation.json"

          validation_path.write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit validation result
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "font-roundtrip-v2/${OUTPUT_KEY}"
          git commit \
            -m \
            "Store font roundtrip v2 ${FONT_FILENAME} [${OUTPUT_KEY}]"

          for attempt in 1 2 3 4 5
          do
            if git push origin "HEAD:${GITHUB_REF_NAME}"
            then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing and retrying..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 2))
          done

          echo "Unable to push output after 5 attempts" >&2
          exit 1
