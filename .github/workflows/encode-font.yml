name: Encode and validate arbitrary font

run-name: >-
  Encode+Validate ${{ inputs.filename }}
  [${{ inputs.output_key }}]

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public HTTPS direct URL of the font file
        required: true
        type: string

      filename:
        description: Safe output font filename
        required: true
        type: string

      output_key:
        description: Unique output directory key generated by the Worker
        required: true
        type: string

      source_corpus_url:
        description: Exact public raw HTTPS URL for this mapping key's source-role UTF-8 corpus
        required: true
        type: string

      target_corpus_url:
        description: Exact public raw HTTPS URL for this mapping key's reviewed Chinese target-role UTF-8 corpus
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: >-
    encode-font-${{ inputs.output_key }}

  cancel-in-progress: false

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_URL: >-
        ${{ inputs.source_url }}

      REQUESTED_FILENAME: >-
        ${{ inputs.filename }}

      OUTPUT_KEY: >-
        ${{ inputs.output_key }}

      SOURCE_CORPUS_URL: >-
        ${{ inputs.source_corpus_url }}

      TARGET_CORPUS_URL: >-
        ${{ inputs.target_corpus_url }}

      # 70 MiB。
      MAX_BYTES: "73400320"

      MAX_CORPUS_BYTES: "26214400"
      MAX_CORPUS_CHARS: "2000000"
      CORPUS_CHUNK_CHARS: "200"

      REQUIRED_PYMUPDF_VERSION: "1.26.7"
      REQUIRED_FONTTOOLS_VERSION: "4.63.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            "PyMuPDF==${REQUIRED_PYMUPDF_VERSION}" \
            "fonttools==${REQUIRED_FONTTOOLS_VERSION}"

      - name: Download, encode, and validate font
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import base64
          import hashlib
          import ipaddress
          import itertools
          import json
          import os
          import platform
          import re
          import socket
          import string
          import unicodedata
          import urllib.error
          import urllib.parse
          import urllib.request

          from collections import defaultdict
          from pathlib import Path

          import fitz
          import fontTools
          from fontTools.ttLib import TTFont, TTLibError


          # =========================================================
          # 基础参数
          # =========================================================

          source_url = os.environ[
              "SOURCE_URL"
          ].strip()

          filename = os.environ[
              "REQUESTED_FILENAME"
          ].strip()

          output_key = os.environ[
              "OUTPUT_KEY"
          ].strip()

          max_bytes = int(
              os.environ[
                  "MAX_BYTES"
              ]
          )

          source_corpus_url = os.environ.get(
              "SOURCE_CORPUS_URL",
              "",
          ).strip()

          target_corpus_url = os.environ.get(
              "TARGET_CORPUS_URL",
              "",
          ).strip()

          max_corpus_bytes = int(
              os.environ[
                  "MAX_CORPUS_BYTES"
              ]
          )

          max_corpus_chars = int(
              os.environ[
                  "MAX_CORPUS_CHARS"
              ]
          )

          corpus_chunk_chars = int(
              os.environ[
                  "CORPUS_CHUNK_CHARS"
              ]
          )

          required_pymupdf_version = (
              os.environ[
                  "REQUIRED_PYMUPDF_VERSION"
              ]
          )

          required_fonttools_version = (
              os.environ[
                  "REQUIRED_FONTTOOLS_VERSION"
              ]
          )

          validation_policy = (
              "strict-v3-font-role-corpus"
          )


          # =========================================================
          # 固定依赖版本
          # =========================================================

          if (
              fitz.__version__
              != required_pymupdf_version
          ):
              raise RuntimeError(
                  "Unexpected PyMuPDF version: "
                  f"{fitz.__version__}; "
                  f"required="
                  f"{required_pymupdf_version}"
              )


          if (
              fontTools.__version__
              != required_fonttools_version
          ):
              raise RuntimeError(
                  "Unexpected fontTools version: "
                  f"{fontTools.__version__}; "
                  f"required="
                  f"{required_fonttools_version}"
              )


          # =========================================================
          # 输入校验
          # =========================================================

          if not re.fullmatch(
              r"[a-f0-9]{32}",
              output_key,
          ):
              raise RuntimeError(
                  "Invalid output_key"
              )


          if not re.fullmatch(
              (
                  r"[A-Za-z0-9]"
                  r"[A-Za-z0-9._-]{0,119}"
              ),
              filename,
          ):
              raise RuntimeError(
                  "Invalid filename"
              )


          if len(source_url) > 4096:
              raise RuntimeError(
                  "source_url is too long"
              )

          for corpus_label, corpus_url in (
              ("source_corpus_url", source_corpus_url),
              ("target_corpus_url", target_corpus_url),
          ):
              if not corpus_url:
                  raise RuntimeError(
                      f"{corpus_label} is required"
                  )

              if len(corpus_url) > 4096:
                  raise RuntimeError(
                      f"{corpus_label} is too long"
                  )


          # =========================================================
          # URL 安全验证
          # =========================================================

          def validate_public_https_url(
              value: str,
          ) -> str:

              parsed = (
                  urllib.parse
                  .urlsplit(value)
              )

              if (
                  parsed.scheme.lower()
                  != "https"
              ):
                  raise RuntimeError(
                      "Only HTTPS source URLs "
                      "are allowed"
                  )

              if not parsed.hostname:
                  raise RuntimeError(
                      "Source URL has "
                      "no hostname"
                  )

              if (
                  parsed.username
                  or parsed.password
              ):
                  raise RuntimeError(
                      "Source URL must not "
                      "contain embedded "
                      "credentials"
                  )

              try:
                  port = (
                      parsed.port
                      or 443
                  )

              except ValueError as exc:
                  raise RuntimeError(
                      "Source URL has "
                      "an invalid port"
                  ) from exc

              hostname = (
                  parsed.hostname
                  .rstrip(".")
              )

              lowered = (
                  hostname.lower()
              )

              if (
                  lowered == "localhost"
                  or lowered.endswith(
                      ".localhost"
                  )
              ):
                  raise RuntimeError(
                      "localhost is "
                      "not allowed"
                  )

              if (
                  lowered.endswith(
                      ".local"
                  )
                  or lowered.endswith(
                      ".internal"
                  )
              ):
                  raise RuntimeError(
                      "Local/internal "
                      "hostnames are "
                      "not allowed"
                  )

              try:
                  addresses = (
                      socket.getaddrinfo(
                          hostname,
                          port,
                          type=(
                              socket
                              .SOCK_STREAM
                          ),
                      )
                  )

              except socket.gaierror as exc:
                  raise RuntimeError(
                      "DNS resolution failed "
                      f"for {hostname}: "
                      f"{exc}"
                  ) from exc

              resolved = set()

              for item in addresses:

                  ip_text = (
                      item[4][0]
                      .split(
                          "%",
                          1,
                      )[0]
                  )

                  resolved.add(
                      ip_text
                  )

              if not resolved:
                  raise RuntimeError(
                      "Hostname resolved "
                      "to no addresses"
                  )

              for ip_text in resolved:

                  ip = (
                      ipaddress.ip_address(
                          ip_text
                      )
                  )

                  if not ip.is_global:
                      raise RuntimeError(
                          "Non-public "
                          "destination is "
                          "not allowed: "
                          f"{ip_text}"
                      )

              return (
                  urllib.parse
                  .urlunsplit(parsed)
              )


          class SafeRedirectHandler(
              urllib.request
              .HTTPRedirectHandler
          ):

              def redirect_request(
                  self,
                  req,
                  fp,
                  code,
                  msg,
                  headers,
                  newurl,
              ):

                  absolute = (
                      urllib.parse
                      .urljoin(
                          req.full_url,
                          newurl,
                      )
                  )

                  validate_public_https_url(
                      absolute
                  )

                  return (
                      super()
                      .redirect_request(
                          req,
                          fp,
                          code,
                          msg,
                          headers,
                          absolute,
                      )
                  )


          # =========================================================
          # 字体格式探测
          # =========================================================

          def detect_font_format(
              prefix: bytes,
              total_size: int,
          ) -> str:

              if prefix.startswith(
                  b"OTTO"
              ):
                  return (
                      "OpenType/CFF"
                  )

              if prefix.startswith(
                  b"\x00\x01\x00\x00"
              ):
                  return (
                      "TrueType/OpenType"
                  )

              if prefix.startswith(
                  b"true"
              ):
                  return "TrueType"

              if prefix.startswith(
                  b"typ1"
              ):
                  return (
                      "OpenType/Type1"
                  )

              if prefix.startswith(
                  b"ttcf"
              ):
                  return (
                      "TrueType/OpenType "
                      "Collection"
                  )

              if prefix.startswith(
                  b"wOFF"
              ):
                  return "WOFF"

              if prefix.startswith(
                  b"wOF2"
              ):
                  return "WOFF2"

              if prefix.startswith(
                  b"%!PS-AdobeFont"
              ):
                  return (
                      "PostScript "
                      "Type 1 ASCII"
                  )

              if prefix.startswith(
                  b"%!FontType1"
              ):
                  return (
                      "PostScript "
                      "Type 1 ASCII"
                  )

              if prefix.startswith(
                  b"\x80\x01"
              ):
                  return (
                      "PostScript "
                      "Type 1 Binary"
                  )

              # Embedded OpenType
              if (
                  total_size >= 36
                  and len(prefix) >= 36
                  and prefix[34:36]
                  == b"LP"
              ):
                  return (
                      "Embedded OpenType"
                  )

              # 独立 CFF / CFF2
              if len(prefix) >= 4:

                  major = prefix[0]
                  minor = prefix[1]
                  header_size = (
                      prefix[2]
                  )

                  if (
                      major == 1
                      and minor == 0
                      and 4
                      <= header_size
                      <= 64
                  ):
                      return "CFF"

                  if (
                      major == 2
                      and minor == 0
                      and header_size == 5
                  ):
                      return "CFF2"

              raise RuntimeError(
                  "Downloaded content "
                  "does not have a "
                  "recognized font "
                  "signature: "
                  f"{prefix[:16]!r}"
              )


          # =========================================================
          # 下载字体
          # =========================================================

          validated_url = (
              validate_public_https_url(
                  source_url
              )
          )

          request = (
              urllib.request.Request(
                  validated_url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "Chrome/124 "
                          "Safari/537.36"
                      ),

                      "Accept":
                          "*/*",

                      "Accept-Encoding":
                          "identity",
                  },
                  method="GET",
              )
          )

          opener = (
              urllib.request
              .build_opener(
                  SafeRedirectHandler()
              )
          )

          temp_path = Path(
              "/tmp/downloaded-font.bin"
          )

          sha256 = (
              hashlib.sha256()
          )

          total = 0
          prefix = bytearray()


          try:

              response = opener.open(
                  request,
                  timeout=45,
              )

          except urllib.error.HTTPError as exc:

              raise RuntimeError(
                  "Font download "
                  "returned HTTP "
                  f"{exc.code}: "
                  f"{exc.reason}"
              ) from exc

          except urllib.error.URLError as exc:

              raise RuntimeError(
                  "Font download "
                  "failed: "
                  f"{exc.reason}"
              ) from exc


          with response:

              status = getattr(
                  response,
                  "status",
                  response.getcode(),
              )

              if (
                  status < 200
                  or status >= 300
              ):
                  raise RuntimeError(
                      "Font download "
                      "returned HTTP "
                      f"{status}"
                  )

              final_url = (
                  validate_public_https_url(
                      response.geturl()
                  )
              )

              content_type = (
                  response.headers.get(
                      "Content-Type",
                      "",
                  )
              )

              content_length = (
                  response.headers.get(
                      "Content-Length"
                  )
              )

              if content_length:

                  try:
                      declared_size = int(
                          content_length
                      )

                  except ValueError:
                      declared_size = None

                  if (
                      declared_size
                      is not None
                      and declared_size
                      > max_bytes
                  ):
                      raise RuntimeError(
                          "Font is too large: "
                          f"declared="
                          f"{declared_size} "
                          f"limit="
                          f"{max_bytes}"
                      )

              with temp_path.open(
                  "wb"
              ) as output:

                  while True:

                      chunk = (
                          response.read(
                              1024 * 1024
                          )
                      )

                      if not chunk:
                          break

                      total += len(chunk)

                      if (
                          total > max_bytes
                      ):
                          raise RuntimeError(
                              "Font exceeded "
                              f"the {max_bytes}"
                              "-byte limit"
                          )

                      if len(prefix) < 128:

                          needed = (
                              128
                              - len(prefix)
                          )

                          prefix.extend(
                              chunk[:needed]
                          )

                      sha256.update(
                          chunk
                      )

                      output.write(
                          chunk
                      )


          if total < 4:
              raise RuntimeError(
                  "Downloaded file "
                  "is too small "
                  "to be a font"
              )


          detected_format = (
              detect_font_format(
                  bytes(prefix),
                  total,
              )
          )

          actual_sha256 = (
              sha256.hexdigest()
          )


          # =========================================================
          # Per-mapping source-role / target-role corpus download
          # =========================================================

          def download_corpus(
              url,
              label,
          ):

              if not url:
                  return {
                      "requested_url": "",
                      "final_url": "",
                      "size_bytes": 0,
                      "sha256": "",
                      "text": "",
                      "normalized_newlines_to_spaces": True,
                  }

              validated = validate_public_https_url(url)

              request = urllib.request.Request(
                  validated,
                  headers={
                      "User-Agent": (
                          "font-validation-corpus/1"
                      ),
                      "Accept": "text/plain, text/markdown, */*",
                      "Accept-Encoding": "identity",
                  },
                  method="GET",
              )

              try:
                  response = opener.open(
                      request,
                      timeout=45,
                  )

              except urllib.error.HTTPError as exc:
                  raise RuntimeError(
                      f"{label} corpus download returned HTTP "
                      f"{exc.code}: {exc.reason}"
                  ) from exc

              except urllib.error.URLError as exc:
                  raise RuntimeError(
                      f"{label} corpus download failed: {exc.reason}"
                  ) from exc

              digest = hashlib.sha256()
              chunks = []
              total_size = 0

              with response:
                  status = getattr(
                      response,
                      "status",
                      response.getcode(),
                  )

                  if status < 200 or status >= 300:
                      raise RuntimeError(
                          f"{label} corpus download returned HTTP {status}"
                      )

                  final = validate_public_https_url(
                      response.geturl()
                  )

                  content_type = (
                      response.headers.get(
                          "Content-Type",
                          "",
                      )
                      .lower()
                  )

                  if "text/html" in content_type:
                      raise RuntimeError(
                          f"{label} corpus URL returned HTML; "
                          "use the exact raw-text URL"
                      )

                  content_length = response.headers.get(
                      "Content-Length"
                  )

                  if content_length:
                      try:
                          declared_size = int(content_length)
                      except ValueError:
                          declared_size = None

                      if (
                          declared_size is not None
                          and declared_size > max_corpus_bytes
                      ):
                          raise RuntimeError(
                              f"{label} corpus is too large: "
                              f"declared={declared_size} "
                              f"limit={max_corpus_bytes}"
                          )

                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break

                      total_size += len(chunk)
                      if total_size > max_corpus_bytes:
                          raise RuntimeError(
                              f"{label} corpus exceeded the "
                              f"{max_corpus_bytes}-byte limit"
                          )

                      digest.update(chunk)
                      chunks.append(chunk)

              try:
                  text = b"".join(chunks).decode("utf-8-sig")
              except UnicodeDecodeError as exc:
                  raise RuntimeError(
                      f"{label} corpus is not valid UTF-8"
                  ) from exc

              controls = [
                  ch for ch in text
                  if ord(ch) < 32 and ch not in "\r\n\t"
              ]

              if controls:
                  raise RuntimeError(
                      f"{label} corpus contains unsupported control "
                      "characters"
                  )

              # PDF 字符提取不会把 Markdown 的换行作为可比较 glyph；
              # 将换行和制表符统一成空格，其他字符保持原样。
              normalized = (
                  text
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
                  .replace("\n", " ")
                  .replace("\t", " ")
              )

              if len(normalized) > max_corpus_chars:
                  raise RuntimeError(
                      f"{label} corpus has too many Unicode characters: "
                      f"{len(normalized)} limit={max_corpus_chars}"
                  )

              if not normalized.strip():
                  raise RuntimeError(
                      f"{label} corpus is empty"
                  )

              return {
                  "requested_url": url,
                  "final_url": final,
                  "size_bytes": total_size,
                  "sha256": digest.hexdigest(),
                  "text": normalized,
                  "normalized_newlines_to_spaces": True,
              }


          source_corpus = download_corpus(
              source_corpus_url,
              "source",
          )

          target_corpus = download_corpus(
              target_corpus_url,
              "target",
          )


          # =========================================================
          # 输出目录
          # =========================================================

          output_dir = (
              Path("encoded")
              / output_key
          )

          output_dir.mkdir(
              parents=True,
              exist_ok=False,
          )

          base64_path = (
              output_dir
              / (
                  f"{filename}"
                  ".b64.txt"
              )
          )

          metadata_path = (
              output_dir
              / "metadata.json"
          )

          target_validation_path = (
              output_dir
              / "validation-target.json"
          )

          source_validation_path = (
              output_dir
              / "validation-source.json"
          )


          # =========================================================
          # Base64
          # =========================================================

          with (
              temp_path.open(
                  "rb"
              ) as source,
              base64_path.open(
                  "wb"
              ) as target,
          ):
              base64.encode(
                  source,
                  target,
              )


          # =========================================================
          # CJK 定义
          # =========================================================

          CJK_COMPAT_UNIFIED_EXCEPTIONS = {
              0xFA0E,
              0xFA0F,
              0xFA11,
              0xFA13,
              0xFA14,
              0xFA1F,
              0xFA21,
              0xFA23,
              0xFA24,
              0xFA27,
              0xFA28,
              0xFA29,
          }


          def is_cjk_compat(
              cp: int,
          ) -> bool:

              return (
                  (
                      0xF900
                      <= cp
                      <= 0xFAFF
                      and cp not in
                      CJK_COMPAT_UNIFIED_EXCEPTIONS
                  )
                  or
                  (
                      0x2F800
                      <= cp
                      <= 0x2FA1F
                  )
              )


          def is_cjk_unified(
              cp: int,
          ) -> bool:

              if (
                  cp
                  in CJK_COMPAT_UNIFIED_EXCEPTIONS
              ):
                  return True

              try:
                  name = (
                      unicodedata.name(
                          chr(cp)
                      )
                  )

              except ValueError:
                  return False

              return name.startswith(
                  "CJK UNIFIED IDEOGRAPH-"
              )


          def is_pua(
              cp: int,
          ) -> bool:

              return (
                  0xE000
                  <= cp
                  <= 0xF8FF
                  or
                  0xF0000
                  <= cp
                  <= 0xFFFFD
                  or
                  0x100000
                  <= cp
                  <= 0x10FFFD
              )


          # =========================================================
          # reverse alias 忽略规则
          # =========================================================

          def is_reverse_alias_ignorable(
              cp: int,
          ) -> bool:
              """
              当前严格模式只忽略 General Category = Cc
              的 Unicode 控制字符。

              例如某些字体将 U+0000..U+001F 与 SPACE
              映射到相同 glyph。这不会影响普通文本写入，
              因此不作为有效 reverse alias。

              Cf / Co / Cn 等类别仍然参与严格检查。
              """

              return (
                  unicodedata.category(
                      chr(cp)
                  )
                  == "Cc"
              )


          # =========================================================
          # cmap 工具函数
          # =========================================================

          def cp_summary(
              cp: int,
          ):

              ch = chr(cp)

              return {
                  "codepoint":
                      f"U+{cp:04X}",

                  "char":
                      ch,

                  "name":
                      unicodedata.name(
                          ch,
                          "<unnamed>",
                      ),

                  "category":
                      unicodedata.category(
                          ch
                      ),
              }


          def cmap_name(
              table,
          ):

              return (
                  "platform="
                  f"{table.platformID}, "
                  "encoding="
                  f"{table.platEncID}, "
                  "format="
                  f"{table.format}"
              )


          def get_font_name(
              font,
          ):

              if "name" not in font:
                  return "<unknown>"

              table = (
                  font["name"]
              )

              return (
                  table.getDebugName(6)
                  or table.getDebugName(4)
                  or table.getDebugName(1)
                  or "<unknown>"
              )


          # =========================================================
          # 静态 cmap 审计
          # =========================================================

          def audit_font(
              font,
          ):

              if "cmap" not in font:

                  return {
                      "font_name":
                          get_font_name(
                              font
                          ),

                      "fatal":
                          "no_cmap_table",

                      "glyph_count":
                          len(
                              font.getGlyphOrder()
                          ),

                      "unicode_cmap_tables":
                          [],

                      "legacy_cmap_tables":
                          [],

                      "variation_cmap_tables":
                          [],

                      "unicode_codepoint_count":
                          0,

                      "cmap_conflict_count":
                          0,

                      "raw_reverse_alias_count":
                          0,

                      "reverse_alias_count":
                          0,

                      "ignored_cc_alias_group_count":
                          0,

                      "ambiguous_glyph_count":
                          0,

                      "ambiguous_standard_codepoint_count":
                          0,

                      "pua_codepoint_count":
                          0,

                      "cmap_conflict_sample":
                          [],

                      "raw_reverse_alias_sample":
                          [],

                      "reverse_alias_sample":
                          [],

                      "cjk_compat_alias_sample":
                          [],

                      "_codepoints":
                          set(),
                  }


              # Unicode -> {glyph}
              cp_to_glyphs = (
                  defaultdict(set)
              )

              # glyph -> {Unicode}
              glyph_to_cps = (
                  defaultdict(set)
              )

              cp_sources = (
                  defaultdict(list)
              )

              unicode_tables = []
              legacy_tables = []
              variation_tables = []

              pua_chars = set()


              # -----------------------------------------------------
              # 所有 cmap 子表
              # -----------------------------------------------------

              for table in (
                  font["cmap"].tables
              ):

                  table_name = (
                      cmap_name(table)
                  )

                  # Unicode Variation Sequences
                  if table.format == 14:

                      variation_tables.append(
                          table_name
                      )

                      continue

                  cmap = getattr(
                      table,
                      "cmap",
                      None,
                  )

                  if not cmap:
                      continue

                  if not table.isUnicode():

                      legacy_tables.append({
                          "table":
                              table_name,

                          "count":
                              len(cmap),
                      })

                      continue

                  unicode_tables.append({
                      "table":
                          table_name,

                      "count":
                          len(cmap),
                  })

                  for (
                      cp,
                      glyph,
                  ) in cmap.items():

                      cp_to_glyphs[
                          cp
                      ].add(
                          glyph
                      )

                      glyph_to_cps[
                          glyph
                      ].add(
                          cp
                      )

                      cp_sources[
                          cp
                      ].append({
                          "table":
                              table_name,

                          "glyph":
                              glyph,
                      })

                      if is_pua(cp):
                          pua_chars.add(
                              cp
                          )


              # -----------------------------------------------------
              # 同 Unicode -> 不同 glyph
              # -----------------------------------------------------

              cmap_conflicts = []

              for (
                  cp,
                  glyphs,
              ) in cp_to_glyphs.items():

                  if len(glyphs) <= 1:
                      continue

                  cmap_conflicts.append({
                      "unicode":
                          cp_summary(cp),

                      "glyphs":
                          sorted(glyphs),

                      "sources":
                          cp_sources[cp],
                  })


              # -----------------------------------------------------
              # glyph -> 多 Unicode
              #
              # raw_reverse_aliases:
              #   不过滤任何 Unicode，仅作诊断。
              #
              # reverse_aliases:
              #   忽略 Cc 后仍有 >=2 个 Unicode，
              #   才算严格模式有效 alias。
              # -----------------------------------------------------

              raw_reverse_aliases = []
              reverse_aliases = []

              cjk_compat_aliases = []

              ambiguous_standard_cps = (
                  set()
              )

              ignored_cc_alias_group_count = 0


              for (
                  glyph,
                  cps,
              ) in glyph_to_cps.items():

                  if len(cps) <= 1:
                      continue

                  ordered_cps = (
                      sorted(cps)
                  )

                  raw_item = {
                      "glyph":
                          glyph,

                      "gid":
                          font.getGlyphID(
                              glyph
                          ),

                      "unicode": [
                          cp_summary(cp)
                          for cp in ordered_cps
                      ],
                  }

                  raw_reverse_aliases.append(
                      raw_item
                  )


                  effective_cps = {
                      cp
                      for cp in cps
                      if not
                      is_reverse_alias_ignorable(
                          cp
                      )
                  }


                  # 原始有 alias，但去掉 Cc 后
                  # 只剩 0/1 个文本 Unicode。
                  if (
                      len(effective_cps)
                      <= 1
                  ):

                      ignored_cc_alias_group_count += 1

                      continue


                  item = {
                      "glyph":
                          glyph,

                      "gid":
                          font.getGlyphID(
                              glyph
                          ),

                      "unicode": [
                          cp_summary(cp)
                          for cp in sorted(
                              effective_cps
                          )
                      ],
                  }

                  reverse_aliases.append(
                      item
                  )


                  standard = {
                      cp
                      for cp
                      in effective_cps
                      if is_cjk_unified(
                          cp
                      )
                  }

                  compat = {
                      cp
                      for cp
                      in effective_cps
                      if is_cjk_compat(
                          cp
                      )
                  }

                  if standard and compat:

                      cjk_compat_aliases.append(
                          item
                      )

                      ambiguous_standard_cps.update(
                          standard
                      )


              return {
                  "font_name":
                      get_font_name(
                          font
                      ),

                  "glyph_count":
                      len(
                          font.getGlyphOrder()
                      ),

                  "unicode_cmap_tables":
                      unicode_tables,

                  "legacy_cmap_tables":
                      legacy_tables,

                  "variation_cmap_tables":
                      variation_tables,

                  "unicode_codepoint_count":
                      len(
                          cp_to_glyphs
                      ),

                  "cmap_conflict_count":
                      len(
                          cmap_conflicts
                      ),

                  # 原始多对一统计。
                  "raw_reverse_alias_count":
                      len(
                          raw_reverse_aliases
                      ),

                  # 去除 Cc 后真正用于严格 FAIL 的统计。
                  "reverse_alias_count":
                      len(
                          reverse_aliases
                      ),

                  "ignored_cc_alias_group_count":
                      ignored_cc_alias_group_count,

                  "ambiguous_glyph_count":
                      len(
                          cjk_compat_aliases
                      ),

                  "ambiguous_standard_codepoint_count":
                      len(
                          ambiguous_standard_cps
                      ),

                  "pua_codepoint_count":
                      len(
                          pua_chars
                      ),

                  # 只输出样本，避免 JSON 巨大。
                  "cmap_conflict_sample":
                      cmap_conflicts[:20],

                  "raw_reverse_alias_sample":
                      raw_reverse_aliases[:20],

                  "reverse_alias_sample":
                      reverse_aliases[:20],

                  "cjk_compat_alias_sample":
                      cjk_compat_aliases[:20],

                  "_codepoints":
                      set(
                          cp_to_glyphs.keys()
                      ),
              }


          # =========================================================
          # 固定严格 profile
          # =========================================================

          TARGET_FIXED_STRINGS = [
              (
                  "中文电源电压监控保护"
                  "绝对最大额定值技术数据手册"
              ),

              "器不量年行更路料串理便利",

              (
                  "控制器寄存器转换器"
                  "驱动器"
              ),

              "测量数量容量电量",

              (
                  "不能不同不使用"
                  "不连接"
              ),

              (
                  "年月更新执行管理"
                  "系列"
              ),
          ]


          ASCII_LETTERS = (
              string.ascii_uppercase
              + string.ascii_lowercase
          )

          ASCII_DIGITS = (
              string.digits
          )

          ASCII_PUNCT = (
              string.punctuation
          )

          CHINESE_PUNCT = (
              "，。；：！？"
              "（）【】《》"
              "、“”‘’"
              "…—"
          )

          TECH_SYMBOLS = (
              "±°µΩ×÷≤≥℃"
          )


          TARGET_TEST_STRINGS = [
              *TARGET_FIXED_STRINGS,
              ASCII_LETTERS,
              ASCII_DIGITS,
              CHINESE_PUNCT,
              ASCII_PUNCT,
              TECH_SYMBOLS,
          ]


          SOURCE_TEST_STRINGS = [
              ASCII_LETTERS,
              ASCII_DIGITS,
              ASCII_PUNCT,
              TECH_SYMBOLS,
          ]


          def ordered_unique_chars(
              strings,
          ):

              seen = set()
              result = []

              for text in strings:

                  for ch in text:

                      if ch in seen:
                          continue

                      seen.add(ch)
                      result.append(ch)

              return result


          def corpus_test_strings(
              text,
          ):

              if not text:
                  return []

              result = []

              for index in range(
                  0,
                  len(text),
                  corpus_chunk_chars,
              ):
                  chunk = text[
                      index:index + corpus_chunk_chars
                  ].strip(" ")

                  if chunk:
                      result.append(chunk)

              return result


          # Caller-provided role corpora are mandatory; legacy constants above
          # are intentionally not used for validation.
          if not source_corpus["text"] or not target_corpus["text"]:
              raise RuntimeError(
                  "Both source_corpus_url and target_corpus_url "
                  "must provide non-empty corpora"
              )

          SOURCE_TEST_STRINGS = corpus_test_strings(
              source_corpus["text"]
          )

          TARGET_TEST_STRINGS = corpus_test_strings(
              target_corpus["text"]
          )

          SOURCE_REQUIRED_CHARS = ordered_unique_chars(
              [source_corpus["text"]]
          )

          TARGET_REQUIRED_CHARS = ordered_unique_chars(
              [target_corpus["text"]]
          )


          # =========================================================
          # PyMuPDF 精确字符提取
          # =========================================================

          def extract_exact_chars(
              page,
          ) -> str:

              raw = (
                  page.get_text(
                      "rawdict"
                  )
              )

              chars = []

              for block in raw.get(
                  "blocks",
                  [],
              ):

                  if (
                      block.get(
                          "type",
                          0,
                      )
                      != 0
                  ):
                      continue

                  for line in block.get(
                      "lines",
                      [],
                  ):

                      for span in line.get(
                          "spans",
                          [],
                      ):

                          for item in span.get(
                              "chars",
                              [],
                          ):

                              chars.append(
                                  item.get(
                                      "c",
                                      "",
                                  )
                              )

              return "".join(
                  chars
              )


          def codepoint_or_none(
              value,
          ):

              if value is None:
                  return None

              return (
                  f"U+{ord(value):04X}"
              )


          def compare_strings(
              expected,
              actual,
              test_index,
              max_differences=30,
          ):

              differences = []

              for (
                  char_index,
                  pair,
              ) in enumerate(
                  itertools.zip_longest(
                      expected,
                      actual,
                      fillvalue=None,
                  )
              ):

                  (
                      expected_char,
                      actual_char,
                  ) = pair

                  if (
                      expected_char
                      == actual_char
                  ):
                      continue

                  differences.append({
                      "test_index":
                          test_index,

                      "char_index":
                          char_index,

                      "expected_char":
                          expected_char,

                      "expected_codepoint":
                          codepoint_or_none(
                              expected_char
                          ),

                      "actual_char":
                          actual_char,

                      "actual_codepoint":
                          codepoint_or_none(
                              actual_char
                          ),
                  })

                  if (
                      len(differences)
                      >= max_differences
                  ):
                      break

              return differences


          # =========================================================
          # PyMuPDF roundtrip
          # =========================================================

          def run_roundtrip_method(
              font_path,
              test_strings,
              method,
              profile,
          ):

              output_pdf = (
                  Path("/tmp")
                  / (
                      "roundtrip-"
                      f"{profile}-"
                      f"{method}.pdf"
                  )
              )

              result = {
                  "status":
                      "fail",

                  "test_string_count":
                      len(test_strings),

                  "test_char_count":
                      sum(
                          len(value)
                          for value in test_strings
                      ),

                  "exact_roundtrip":
                      False,

                  "subset_fonts_tested":
                      False,

                  "difference_count":
                      0,

                  "differences":
                      [],

                  "compatibility_ideographs_found_after_extract":
                      False,
              }

              doc = None

              try:

                  doc = fitz.open()


                  # 每个测试字符串独立一页，
                  # 避免布局换行干扰字符比较。
                  for (
                      index,
                      text,
                  ) in enumerate(
                      test_strings
                  ):

                      page = (
                          doc.new_page(
                              width=5000,
                              height=240,
                          )
                      )

                      font_name = (
                          f"F{index}"
                      )

                      page.insert_font(
                          fontname=
                              font_name,

                          fontfile=
                              str(
                                  font_path
                              ),

                          set_simple=
                              False,
                      )


                      if (
                          method
                          == "insert_text"
                      ):

                          page.insert_text(
                              (30, 120),
                              text,
                              fontname=
                                  font_name,
                              fontsize=18,
                          )


                      elif (
                          method
                          == "insert_textbox"
                      ):

                          rc = (
                              page.insert_textbox(
                                  fitz.Rect(
                                      30,
                                      30,
                                      4970,
                                      210,
                                  ),
                                  text,
                                  fontname=
                                      font_name,
                                  fontsize=18,
                                  align=0,
                              )
                          )

                          if rc < 0:

                              raise RuntimeError(
                                  "insert_textbox "
                                  "did not fit: "
                                  f"test_index="
                                  f"{index} "
                                  f"rc={rc}"
                              )


                      else:

                          raise RuntimeError(
                              "Unknown method: "
                              f"{method}"
                          )


                  doc.subset_fonts(
                      fallback=True
                  )

                  result[
                      "subset_fonts_tested"
                  ] = True


                  doc.save(
                      str(
                          output_pdf
                      ),
                      garbage=4,
                      deflate=True,
                  )

                  doc.close()
                  doc = None


                  # -------------------------------------------------
                  # 必须关闭后重新打开。
                  # -------------------------------------------------

                  reopened = (
                      fitz.open(
                          str(
                              output_pdf
                          )
                      )
                  )

                  all_differences = []

                  compatibility_found = (
                      False
                  )

                  try:

                      if (
                          reopened.page_count
                          != len(
                              test_strings
                          )
                      ):

                          raise RuntimeError(
                              "Unexpected "
                              "roundtrip "
                              "page count: "
                              f"{reopened.page_count}"
                          )


                      for (
                          index,
                          expected,
                      ) in enumerate(
                          test_strings
                      ):

                          actual = (
                              extract_exact_chars(
                                  reopened[
                                      index
                                  ]
                              )
                          )


                          if any(
                              is_cjk_compat(
                                  ord(ch)
                              )
                              for ch in actual
                          ):
                              compatibility_found = (
                                  True
                              )


                          if (
                              expected
                              != actual
                          ):

                              remaining = (
                                  30
                                  - len(
                                      all_differences
                                  )
                              )

                              if remaining > 0:

                                  all_differences.extend(
                                      compare_strings(
                                          expected,
                                          actual,
                                          index,
                                          remaining,
                                      )
                                  )

                  finally:

                      reopened.close()


                  result[
                      "differences"
                  ] = all_differences

                  result[
                      "difference_count"
                  ] = len(
                      all_differences
                  )

                  result[
                      "compatibility_ideographs_found_after_extract"
                  ] = compatibility_found


                  if not all_differences:

                      result[
                          "status"
                      ] = "pass"

                      result[
                          "exact_roundtrip"
                      ] = True


              except Exception as exc:

                  result[
                      "error"
                  ] = (
                      f"{type(exc).__name__}: "
                      f"{exc}"
                  )


              finally:

                  if doc is not None:

                      try:
                          doc.close()
                      except Exception:
                          pass

                  try:
                      output_pdf.unlink(
                          missing_ok=True
                      )
                  except Exception:
                      pass


              return result


          # =========================================================
          # 验证报告基础字段
          # =========================================================

          def build_base_validation(
              profile,
          ):

              return {
                  "version":
                      2,

                  "profile":
                      profile,

                  "strict":
                      True,

                  "validation_policy":
                      validation_policy,

                  "filename":
                      filename,

                  "source_url":
                      source_url,

                  "corpus": {
                      "requested_url": (
                          source_corpus["requested_url"]
                          if profile == "source"
                          else target_corpus["requested_url"]
                      ),
                      "final_url": (
                          source_corpus["final_url"]
                          if profile == "source"
                          else target_corpus["final_url"]
                      ),
                      "size_bytes": (
                          source_corpus["size_bytes"]
                          if profile == "source"
                          else target_corpus["size_bytes"]
                      ),
                      "sha256": (
                          source_corpus["sha256"]
                          if profile == "source"
                          else target_corpus["sha256"]
                      ),
                      "chunk_chars": corpus_chunk_chars,
                      "test_string_count": (
                          len(SOURCE_TEST_STRINGS)
                          if profile == "source"
                          else len(TARGET_TEST_STRINGS)
                      ),
                      "normalized_newlines_to_spaces": True,
                  },

                  "final_url":
                      final_url,

                  "size_bytes":
                      total,

                  "sha256":
                      actual_sha256,

                  "detected_format":
                      detected_format,

                  "environment": {
                      "python_version":
                          platform.python_version(),

                      "pymupdf_version":
                          fitz.__version__,

                      "fonttools_version":
                          fontTools.__version__,
                  },
              }


          # =========================================================
          # 单 profile 验证
          # =========================================================

          def build_validation(
              profile,
              audit,
              required_chars,
              test_strings,
              pymupdf_load,
          ):

              result = (
                  build_base_validation(
                      profile
                  )
              )

              failure_codes = []

              suffix = (
                  Path(filename)
                  .suffix
                  .lower()
              )


              # -----------------------------------------------------
              # 阶段 0 生产字体：
              # 仅允许 TTF / OTF。
              # -----------------------------------------------------

              if suffix not in {
                  ".ttf",
                  ".otf",
              }:

                  failure_codes.append(
                      "unsupported_font_extension"
                  )


              # -----------------------------------------------------
              # fontTools / cmap
              # -----------------------------------------------------

              if audit.get(
                  "fatal"
              ):

                  failure_codes.append(
                      audit["fatal"]
                  )


              if not audit.get(
                  "unicode_cmap_tables",
                  [],
              ):

                  failure_codes.append(
                      "no_unicode_cmap"
                  )


              if (
                  audit.get(
                      "cmap_conflict_count",
                      0,
                  )
                  > 0
              ):

                  failure_codes.append(
                      "cmap_conflicts_present"
                  )


              # -----------------------------------------------------
              # strict-v2：
              #
              # raw_reverse_alias_count 不参与 FAIL。
              #
              # reverse_alias_count 已经排除了 Cc，
              # 只要剩余实际 Unicode 多对一，就 FAIL。
              # -----------------------------------------------------

              if (
                  audit.get(
                      "reverse_alias_count",
                      0,
                  )
                  > 0
              ):

                  failure_codes.append(
                      "reverse_aliases_present"
                  )


              # -----------------------------------------------------
              # 仍然保持最严格 legacy cmap 策略。
              # -----------------------------------------------------

              if audit.get(
                  "legacy_cmap_tables",
                  [],
              ):

                  failure_codes.append(
                      "legacy_cmap_present"
                  )


              # -----------------------------------------------------
              # coverage
              # -----------------------------------------------------

              available_codepoints = (
                  audit.get(
                      "_codepoints",
                      set(),
                  )
              )

              missing_chars = [
                  ch
                  for ch
                  in required_chars
                  if ord(ch)
                  not in available_codepoints
              ]

              if missing_chars:

                  failure_codes.append(
                      "required_characters_missing"
                  )


              # -----------------------------------------------------
              # PyMuPDF load
              # -----------------------------------------------------

              if not pymupdf_load[
                  "passed"
              ]:

                  failure_codes.append(
                      "pymupdf_load_failed"
                  )


              # -----------------------------------------------------
              # 删除内部字段
              # -----------------------------------------------------

              public_audit = {
                  key:
                      value

                  for (
                      key,
                      value,
                  ) in audit.items()

                  if not key.startswith(
                      "_"
                  )
              }


              result[
                  "static_audit"
              ] = public_audit


              result[
                  "coverage"
              ] = {

                  "required_count":
                      len(
                          required_chars
                      ),

                  "missing_count":
                      len(
                          missing_chars
                      ),

                  "missing": [
                      cp_summary(
                          ord(ch)
                      )
                      for ch
                      in missing_chars[:100]
                  ],

                  "passed":
                      not missing_chars,
              }


              result[
                  "pymupdf_load"
              ] = pymupdf_load


              # -----------------------------------------------------
              # 前置严格检查失败：
              # 不浪费时间跑动态 roundtrip。
              # -----------------------------------------------------

              if failure_codes:

                  result[
                      "roundtrip"
                  ] = {

                      "status":
                          "not_run",

                      "reason":
                          (
                              "pre_roundtrip_"
                              "validation_failed"
                          ),

                      "insert_text": {
                          "status":
                              "not_run"
                      },

                      "insert_textbox": {
                          "status":
                              "not_run"
                      },

                      "subset_fonts_tested":
                          False,

                      "compatibility_ideographs_found_after_extract":
                          False,
                  }


              # -----------------------------------------------------
              # 真正 PDF 精确往返
              # -----------------------------------------------------

              else:

                  insert_text = (
                      run_roundtrip_method(
                          temp_path,
                          test_strings,
                          "insert_text",
                          profile,
                      )
                  )

                  insert_textbox = (
                      run_roundtrip_method(
                          temp_path,
                          test_strings,
                          "insert_textbox",
                          profile,
                      )
                  )


                  roundtrip_passed = (
                      insert_text[
                          "exact_roundtrip"
                      ]
                      and
                      insert_textbox[
                          "exact_roundtrip"
                      ]
                      and
                      insert_text[
                          "subset_fonts_tested"
                      ]
                      and
                      insert_textbox[
                          "subset_fonts_tested"
                      ]
                  )


                  compatibility_found = (
                      insert_text[
                          "compatibility_ideographs_found_after_extract"
                      ]
                      or
                      insert_textbox[
                          "compatibility_ideographs_found_after_extract"
                      ]
                  )


                  result[
                      "roundtrip"
                  ] = {

                      "status":
                          (
                              "pass"
                              if roundtrip_passed
                              else "fail"
                          ),

                      "insert_text":
                          insert_text,

                      "insert_textbox":
                          insert_textbox,

                      "subset_fonts_tested":
                          (
                              insert_text[
                                  "subset_fonts_tested"
                              ]
                              and
                              insert_textbox[
                                  "subset_fonts_tested"
                              ]
                          ),

                      "compatibility_ideographs_found_after_extract":
                          compatibility_found,
                  }


                  if not insert_text[
                      "exact_roundtrip"
                  ]:

                      failure_codes.append(
                          (
                              "insert_text_"
                              "exact_roundtrip_failed"
                          )
                      )


                  if not insert_textbox[
                      "exact_roundtrip"
                  ]:

                      failure_codes.append(
                          (
                              "insert_textbox_"
                              "exact_roundtrip_failed"
                          )
                      )


                  if compatibility_found:

                      failure_codes.append(
                          (
                              "compatibility_"
                              "ideographs_found_"
                              "after_extract"
                          )
                      )


              # -----------------------------------------------------
              # 去重
              # -----------------------------------------------------

              deduped_failure_codes = (
                  list(
                      dict.fromkeys(
                          failure_codes
                      )
                  )
              )


              result[
                  "failure_codes"
              ] = (
                  deduped_failure_codes
              )


              # -----------------------------------------------------
              # 最终 PASS / FAIL
              # -----------------------------------------------------

              if deduped_failure_codes:

                  result[
                      "result"
                  ] = "fail"

                  first = (
                      deduped_failure_codes[
                          0
                      ]
                  )


                  if first in {
                      "unsupported_font_extension",
                  }:

                      stage = "format"


                  elif first in {
                      "no_cmap_table",
                      "fonttools_open_failed",
                      "no_unicode_cmap",
                      "cmap_conflicts_present",
                      "reverse_aliases_present",
                      "legacy_cmap_present",
                  }:

                      stage = (
                          "strict_cmap"
                      )


                  elif (
                      first
                      == "required_characters_missing"
                  ):

                      stage = "coverage"


                  elif (
                      first
                      == "pymupdf_load_failed"
                  ):

                      stage = (
                          "pymupdf_load"
                      )


                  else:

                      stage = "roundtrip"


                  result[
                      "failure_stage"
                  ] = stage


              else:

                  result[
                      "result"
                  ] = "pass"


              return result


          # =========================================================
          # fontTools 打开字体
          # =========================================================

          audit = None

          try:

              font = TTFont(
                  str(temp_path),
                  lazy=False,
              )


          except (
              TTLibError,
              OSError,
          ) as exc:

              audit = {

                  "font_name":
                      "<unreadable>",

                  "fatal":
                      "fonttools_open_failed",

                  "fonttools_error":
                      (
                          f"{type(exc).__name__}: "
                          f"{exc}"
                      ),

                  "glyph_count":
                      0,

                  "unicode_cmap_tables":
                      [],

                  "legacy_cmap_tables":
                      [],

                  "variation_cmap_tables":
                      [],

                  "unicode_codepoint_count":
                      0,

                  "cmap_conflict_count":
                      0,

                  "raw_reverse_alias_count":
                      0,

                  "reverse_alias_count":
                      0,

                  "ignored_cc_alias_group_count":
                      0,

                  "ambiguous_glyph_count":
                      0,

                  "ambiguous_standard_codepoint_count":
                      0,

                  "pua_codepoint_count":
                      0,

                  "cmap_conflict_sample":
                      [],

                  "raw_reverse_alias_sample":
                      [],

                  "reverse_alias_sample":
                      [],

                  "cjk_compat_alias_sample":
                      [],

                  "_codepoints":
                      set(),
              }


          else:

              try:

                  audit = (
                      audit_font(
                          font
                      )
                  )

              finally:

                  font.close()


          # =========================================================
          # PyMuPDF 字体加载
          # =========================================================

          pymupdf_load = {
              "passed":
                  False,
          }


          try:

              fitz_font = (
                  fitz.Font(
                      fontfile=
                          str(
                              temp_path
                          )
                  )
              )

              pymupdf_load.update({
                  "passed":
                      True,

                  "font_name":
                      fitz_font.name,

                  "glyph_count":
                      fitz_font.glyph_count,
              })


          except Exception as exc:

              pymupdf_load[
                  "error"
              ] = (
                  f"{type(exc).__name__}: "
                  f"{exc}"
              )


          # =========================================================
          # target / source 验证
          # =========================================================

          target_validation = (
              build_validation(
                  profile=
                      "target",

                  audit=
                      audit,

                  required_chars=
                      TARGET_REQUIRED_CHARS,

                  test_strings=
                      TARGET_TEST_STRINGS,

                  pymupdf_load=
                      pymupdf_load,
              )
          )


          source_validation = (
              build_validation(
                  profile=
                      "source",

                  audit=
                      audit,

                  required_chars=
                      SOURCE_REQUIRED_CHARS,

                  test_strings=
                      SOURCE_TEST_STRINGS,

                  pymupdf_load=
                      pymupdf_load,
              )
          )


          # =========================================================
          # 写 validation JSON
          # =========================================================

          target_validation_path.write_text(
              (
                  json.dumps(
                      target_validation,
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n"
              ),
              encoding="utf-8",
          )


          source_validation_path.write_text(
              (
                  json.dumps(
                      source_validation,
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n"
              ),
              encoding="utf-8",
          )


          # =========================================================
          # metadata
          # =========================================================

          metadata = {

              "source_url":
                  source_url,

              "source_corpus": {
                  key: value
                  for key, value in source_corpus.items()
                  if key != "text"
              },

              "target_corpus": {
                  key: value
                  for key, value in target_corpus.items()
                  if key != "text"
              },

              "final_url":
                  final_url,

              "filename":
                  filename,

              "output_key":
                  output_key,

              "size_bytes":
                  total,

              "sha256":
                  actual_sha256,

              "detected_format":
                  detected_format,

              "content_type":
                  content_type,

              "base64_file":
                  str(
                      base64_path
                      .as_posix()
                  ),

              "base64_size_bytes":
                  (
                      base64_path
                      .stat()
                      .st_size
                  ),

              "validation_target_file":
                  str(
                      target_validation_path
                      .as_posix()
                  ),

              "validation_source_file":
                  str(
                      source_validation_path
                      .as_posix()
                  ),

              "validation_target_result":
                  target_validation[
                      "result"
                  ],

              "validation_source_result":
                  source_validation[
                      "result"
                  ],

              "validation_policy":
                  validation_policy,

              "validation_environment": {

                  "python_version":
                      platform.python_version(),

                  "pymupdf_version":
                      fitz.__version__,

                  "fonttools_version":
                      fontTools.__version__,
              },
          }


          metadata_path.write_text(
              (
                  json.dumps(
                      metadata,
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n"
              ),
              encoding="utf-8",
          )


          # =========================================================
          # Action 日志摘要
          # =========================================================

          print(
              json.dumps(
                  {

                      "metadata":
                          metadata,


                      "target_validation": {

                          "result":
                              target_validation[
                                  "result"
                              ],

                          "failure_stage":
                              target_validation.get(
                                  "failure_stage"
                              ),

                          "failure_codes":
                              target_validation[
                                  "failure_codes"
                              ],

                          "raw_reverse_alias_count":
                              target_validation[
                                  "static_audit"
                              ].get(
                                  "raw_reverse_alias_count",
                                  0,
                              ),

                          "reverse_alias_count":
                              target_validation[
                                  "static_audit"
                              ].get(
                                  "reverse_alias_count",
                                  0,
                              ),

                          "ignored_cc_alias_group_count":
                              target_validation[
                                  "static_audit"
                              ].get(
                                  "ignored_cc_alias_group_count",
                                  0,
                              ),

                          "ambiguous_glyph_count":
                              target_validation[
                                  "static_audit"
                              ].get(
                                  "ambiguous_glyph_count",
                                  0,
                              ),

                          "legacy_cmap_count":
                              len(
                                  target_validation[
                                      "static_audit"
                                  ].get(
                                      "legacy_cmap_tables",
                                      [],
                                  )
                              ),
                      },


                      "source_validation": {

                          "result":
                              source_validation[
                                  "result"
                              ],

                          "failure_stage":
                              source_validation.get(
                                  "failure_stage"
                              ),

                          "failure_codes":
                              source_validation[
                                  "failure_codes"
                              ],

                          "raw_reverse_alias_count":
                              source_validation[
                                  "static_audit"
                              ].get(
                                  "raw_reverse_alias_count",
                                  0,
                              ),

                          "reverse_alias_count":
                              source_validation[
                                  "static_audit"
                              ].get(
                                  "reverse_alias_count",
                                  0,
                              ),

                          "ignored_cc_alias_group_count":
                              source_validation[
                                  "static_audit"
                              ].get(
                                  "ignored_cc_alias_group_count",
                                  0,
                              ),

                          "ambiguous_glyph_count":
                              source_validation[
                                  "static_audit"
                              ].get(
                                  "ambiguous_glyph_count",
                                  0,
                              ),

                          "legacy_cmap_count":
                              len(
                                  source_validation[
                                      "static_audit"
                                  ].get(
                                      "legacy_cmap_tables",
                                      [],
                                  )
                              ),
                      },
                  },

                  ensure_ascii=False,
                  indent=2,
              )
          )


          # =========================================================
          # 注意
          # =========================================================
          #
          # 字体验证得到 result=fail，
          # 不代表 Action 执行失败。
          #
          # “成功证明候选字体不合格”
          # 仍然是一次成功的 workflow。
          #
          # 只有：
          # - 下载失败
          # - Python / 依赖环境失败
          # - 程序异常
          # - 文件写入失败
          # - Git commit / push 失败
          #
          # 才应该使 GitHub Action 本身失败。
          #
          PY

      - name: Commit encoded and validation output
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "encoded/${OUTPUT_KEY}"

          git commit \
            -m \
            "Encode and validate font ${REQUESTED_FILENAME} [${OUTPUT_KEY}]"

          for attempt in 1 2 3 4 5
          do
            if git push \
              origin \
              "HEAD:${GITHUB_REF_NAME}"
            then
              exit 0
            fi

            echo \
              "Push attempt ${attempt} failed; rebasing and retrying..."

            git fetch \
              origin \
              "${GITHUB_REF_NAME}"

            git rebase \
              "origin/${GITHUB_REF_NAME}"

            sleep \
              $((attempt * 2))
          done

          echo \
            "Unable to push output after 5 attempts" \
            >&2

          exit 1
